name: tests

# The offline suite only. tests/e2e/ needs a Canvas token and a disposable
# course, so it stays a human step; the @pytest.mark.canvas marker and the
# tests/e2e/ path already draw that line.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit and integration tests
        run: pytest tests/unit tests/integration
